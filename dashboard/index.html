<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rede neural em 3D</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/painel.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="assets/js/principal.js"></script>
</head>
<body>
  <header class="cabecalho">
    <h1 class="cabecalho__titulo">Rede neural em 3D</h1>
    <p class="cabecalho__subtitulo">
      4 entradas → 6 → 5 neurônios ocultos → 3 saídas.
      Clique num neurônio para ver o cálculo.
    </p>
  </header>

  <main class="layout">
    <section id="cena" class="layout__cena" aria-label="Cena 3D da rede neural"></section>

    <aside id="painel" class="layout__painel painel">
      <section class="painel__bloco">
        <h2 class="painel__titulo">Entradas</h2>
        <form id="form-entradas" class="painel__entradas">
          <label class="painel__rotulo" for="entrada-0">Entrada 1</label>
          <input id="entrada-0" class="painel__campo" type="number"
            step="0.1" min="-1" max="1" value="0.5">
          <label class="painel__rotulo" for="entrada-1">Entrada 2</label>
          <input id="entrada-1" class="painel__campo" type="number"
            step="0.1" min="-1" max="1" value="-0.3">
          <label class="painel__rotulo" for="entrada-2">Entrada 3</label>
          <input id="entrada-2" class="painel__campo" type="number"
            step="0.1" min="-1" max="1" value="0.8">
          <label class="painel__rotulo" for="entrada-3">Entrada 4</label>
          <input id="entrada-3" class="painel__campo" type="number"
            step="0.1" min="-1" max="1" value="0.1">
          <button id="botao-propagar" class="botao" type="button">Propagar</button>
        </form>
      </section>

      <section class="painel__bloco">
        <h2 class="painel__titulo">Neurônio selecionado</h2>
        <div id="calculo-neuronio" class="painel__calculo">
          <p class="painel__dica">
            Clique num neurônio oculto ou de saída para ver o cálculo.
          </p>
        </div>
      </section>

      <section class="painel__bloco">
        <h2 class="painel__titulo">Probabilidades da saída</h2>
        <div id="barras-probabilidade" class="painel__barras"></div>
      </section>

      <section class="painel__bloco">
        <h2 class="painel__titulo">Legenda</h2>
        <ul class="legenda">
          <li class="legenda__item">
            <span class="legenda__cor legenda__cor--negativo"></span>Peso negativo
          </li>
          <li class="legenda__item">
            <span class="legenda__cor legenda__cor--positivo"></span>Peso positivo
          </li>
          <li class="legenda__item">
            <span class="legenda__cor legenda__cor--ativo"></span>Neurônio ativo
          </li>
        </ul>
      </section>
    </aside>
  </main>

  <p id="aviso" class="aviso" hidden></p>
</body>
</html>
