<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentes ao vivo</title>
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/graphs.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="assets/js/menu.js"></script>
  <script type="module" src="assets/js/agentes.js"></script>
</head>
<body class="tela-cheia">
  <header class="barra">
    <nav class="abas abas--barra" aria-label="Navegação" data-menu
      data-menu-ocultar="../index.html index.html cena.html"></nav>
  </header>

  <main id="cena" class="tela-cheia__cena" aria-label="Cena 3D com as tarefas reais dos agentes">
    <section class="sobreposto sobreposto--topo-esquerda transmissao" aria-label="Transmissão">
      <p id="selo-ao-vivo" class="transmissao__selo">● ao vivo</p>
      <p id="estado-conexao" class="transmissao__conexao transmissao__conexao--offline"
        aria-live="polite">Offline: lendo do GitHub</p>
      <label class="painel__rotulo" for="atraso">Atraso</label>
      <select id="atraso" class="painel__campo transmissao__atraso"></select>
      <p id="estado-leitura" class="transmissao__estado" aria-live="polite">Lendo o quadro…</p>
      <p id="nota-movimento" class="transmissao__estado" hidden>Movimento reduzido: sem animação.</p>
    </section>

    <section class="sobreposto sobreposto--topo-direita" aria-label="Tarefas por status e níveis">
      <ul id="contagem" class="contagem"></ul>
      <ul class="legenda" aria-label="Cor do cartão pelo nível">
        <li><span class="legenda__cor legenda__cor--leve"></span>LEVE</li>
        <li><span class="legenda__cor legenda__cor--medio"></span>MEDIO</li>
        <li><span class="legenda__cor legenda__cor--pesado"></span>PESADO</li>
        <li><span class="legenda__cor legenda__cor--usuario"></span>Usuário</li>
      </ul>
    </section>

    <section class="sobreposto sobreposto--baixo-esquerda" aria-label="Últimos eventos">
      <p id="eventos-vazio" class="transmissao__estado">Sem mudanças no quadro desde que a página abriu.</p>
      <ol id="eventos" class="eventos" aria-live="polite"></ol>
    </section>
  </main>

  <p id="aviso" class="aviso" hidden></p>
</body>
</html>
