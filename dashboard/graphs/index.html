<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D GRAPHS AI</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="assets/css/graphs.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="assets/js/principal.js"></script>
</head>
<body>
  <header class="cabecalho">
    <h1 class="cabecalho__titulo">3D GRAPHS AI</h1>
    <p class="cabecalho__subtitulo">
      Modelos 3D gerados por IA a partir de texto (API Tripo, a mais barata da coleta).
    </p>
    <nav class="abas" aria-label="Navegação">
      <a class="abas__botao" href="../index.html">← Voltar ao dashboard</a>
    </nav>
  </header>

  <main class="graphs">
    <section id="cena" class="graphs__cena" aria-label="Visualizador do modelo 3D">
      <p id="rotulo-cena" class="graphs__rotulo"></p>
    </section>

    <aside class="graphs__painel painel">
      <section class="painel__bloco">
        <h2 class="painel__titulo">Gerar modelo (texto → 3D)</h2>
        <form id="form-gerar" class="gerar">
          <label class="painel__rotulo" for="prompt">Descreva o objeto</label>
          <textarea id="prompt" class="painel__campo gerar__prompt" rows="3" maxlength="1024"
            placeholder="Ex.: um robô fofo de brinquedo, estilo cartoon"></textarea>
          <p id="custo" class="gerar__custo"></p>
          <button id="botao-gerar" class="botao" type="submit" disabled>Gerar</button>
        </form>
        <p id="estado-api" class="gerar__estado"></p>
        <div class="progresso" hidden id="progresso">
          <div class="progresso__trilho"><div id="progresso-barra" class="progresso__barra"></div></div>
          <p id="progresso-texto" class="progresso__texto"></p>
        </div>
      </section>

      <section class="painel__bloco">
        <h2 class="painel__titulo">Galeria</h2>
        <ul id="galeria" class="galeria"></ul>
      </section>
    </aside>
  </main>

  <p id="aviso" class="aviso" hidden></p>
</body>
</html>
